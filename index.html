<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정산 승률 대시보드</title>
<style>
  :root {
    --bg:#0f1115; --card:#171a21; --card-2:#1d212a; --border:#262a33; --text:#eceef1;
    --dim:#9aa1ad; --faint:#6b7280; --accent:#4f8cff; --accent-dim:rgba(79,140,255,.14);
    --win:#34d399; --lose:#f87171;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    padding:32px 16px;
  }
  .wrap { max-width:860px; margin:0 auto; }
  header { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
  h1 { font-size:20px; margin:0; }
  .meta { color:var(--dim); font-size:12.5px; }
  .install-link { color:var(--accent); font-size:12.5px; text-decoration:none; }
  .install-link:hover { text-decoration:underline; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:18px; }
  .section-title { display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; margin:28px 0 10px; }
  .count-badge { background:var(--accent-dim); color:var(--accent); font-weight:600; font-size:10.5px; border-radius:999px; padding:2px 9px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead th {
    text-align:left; font-size:10.5px; font-weight:600; color:var(--faint); text-transform:uppercase;
    letter-spacing:.03em; padding:9px 12px; border-bottom:1px solid var(--border);
  }
  td { padding:8px 12px; border-bottom:1px solid var(--border); }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr:nth-child(odd) { background:rgba(255,255,255,.015); }
  tbody tr:hover { background:rgba(79,140,255,.06); }
  .rank { display:inline-flex; width:18px; color:var(--faint); font-size:11px; font-weight:600; }
  .rank.r1 { color:#ffd166; } .rank.r2 { color:#cfd8e3; } .rank.r3 { color:#e0a675; }
  .name { font-weight:600; }
  .pill {
    display:inline-block; font-size:11px; font-weight:600; padding:2px 7px; border-radius:999px;
    background:rgba(255,255,255,.06); color:var(--dim); white-space:nowrap;
  }
  .rate { font-weight:700; }
  .rate.high { color:var(--win); }
  .rate.low { color:var(--dim); }
  .money { text-align:right; font-variant-numeric:tabular-nums; color:var(--dim); }
  .profit { text-align:right; font-variant-numeric:tabular-nums; font-weight:700; }
  .profit.pos { color:var(--win); } .profit.neg { color:var(--lose); }
  .picks { display:flex; flex-wrap:wrap; gap:3px; max-width:220px; }
  .pick-chip {
    display:inline-block; font-size:10px; font-weight:600; padding:1px 6px; border-radius:999px;
    background:var(--accent-dim); color:var(--accent); border:1px solid rgba(79,140,255,.3);
    white-space:nowrap; text-decoration:none;
  }
  .pick-chip:hover { filter:brightness(1.15); }
  .muted { color:var(--faint); font-size:12px; }
  details.ongoing { margin-bottom:14px; }
  details.ongoing > summary {
    cursor:pointer; list-style:none; display:flex; align-items:center; gap:8px;
    font-weight:700; font-size:14px; margin-bottom:6px; user-select:none;
  }
  details.ongoing > summary::-webkit-details-marker { display:none; }
  details.ongoing > summary:before { content:'▸'; color:var(--faint); font-size:10px; }
  details.ongoing[open] > summary:before { content:'▾'; }
  details.sport { margin-top:4px; }
  details.sport > summary {
    cursor:pointer; list-style:none; display:flex; align-items:center; gap:6px; padding:10px 14px;
    border-radius:10px; background:var(--card); border:1px solid var(--border); font-weight:700; font-size:13px;
  }
  details.sport > summary::-webkit-details-marker { display:none; }
  details.sport > summary:before { content:'▸'; color:var(--faint); font-size:10px; }
  details.sport[open] > summary:before { content:'▾'; }
  .sport-card { margin-top:6px; }
  .sport-header { padding:8px 12px 2px; font-size:11.5px; color:var(--dim); font-weight:700; }
  .empty-state { text-align:center; padding:60px 20px; color:var(--dim); }
  .empty-state .btn {
    display:inline-block; margin-top:14px; background:var(--accent); color:#fff; text-decoration:none;
    padding:9px 16px; border-radius:999px; font-weight:600; font-size:13px;
  }
  .match-card {
    display:block; background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:7px 10px; margin-bottom:4px; text-decoration:none; color:var(--text);
  }
  .match-card:hover { border-color:var(--accent); }
  .match-title { font-size:10.5px; color:var(--dim); margin-bottom:4px; }
  .match-sides { display:flex; align-items:center; gap:6px; }
  .match-side { flex:1; }
  .match-side .team { font-weight:700; font-size:12.5px; margin-bottom:2px; }
  .match-side .bar-track { height:4px; border-radius:999px; background:rgba(255,255,255,.06); overflow:hidden; margin-bottom:2px; }
  .match-side .bar-fill { height:100%; background:var(--accent); border-radius:999px; }
  .match-side .stat { font-size:10.5px; color:var(--faint); }
  .match-side .odds { color:var(--win); font-weight:700; }
  .match-vs { color:var(--faint); font-size:10.5px; font-weight:700; }
  .search-box { position:relative; margin:14px 0 20px; }
  .search-box input {
    width:100%; background:var(--card); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:10px 14px; font-size:14px; outline:none;
  }
  .search-box input:focus { border-color:var(--accent); }
  .search-box .hint { margin-top:6px; font-size:11.5px; color:var(--faint); }
  tr.jsa-hide { display:none; }
  tr.jsa-match td:first-child { position:relative; }
  tr.jsa-match { background:var(--accent-dim) !important; }
  .finder-card {
    background:var(--card); border:1px solid rgba(79,140,255,.35); border-radius:12px;
    padding:12px 14px; margin-bottom:10px;
  }
  .finder-card .finder-name { font-weight:700; font-size:14px; margin-bottom:4px; }
  .finder-card .finder-record { font-size:12px; color:var(--dim); margin-bottom:8px; }
  .finder-card .finder-record .rate-chip { color:var(--win); font-weight:700; }
  .finder-card .finder-picks-label { font-size:11px; color:var(--faint); margin-bottom:4px; font-weight:600; }
  .finder-card .no-picks { font-size:12px; color:var(--faint); }
  .pinned-title { font-size:11.5px; color:var(--faint); font-weight:700; margin:2px 2px 6px; }
  .pinned-grid { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:14px; }
  .pinned-chip {
    display:inline-flex; align-items:center; gap:5px; background:var(--card);
    border:1px solid rgba(255,209,102,.4); border-radius:999px; padding:4px 10px 4px 8px;
    font-size:11.5px; white-space:nowrap; cursor:pointer; user-select:none;
  }
  .pinned-chip:hover { border-color:rgba(255,209,102,.8); }
  .pinned-chip.active { background:rgba(255,209,102,.12); border-color:#ffd166; }
  .pinned-chip .pin-name { font-weight:700; }
  .pinned-chip .pin-rate { font-weight:700; color:var(--win); }
  .pinned-chip .pin-rate.low { color:var(--dim); }
  .pinned-chip .pin-sep { color:var(--faint); }
  .pinned-chip .pin-live { color:var(--accent); font-weight:700; }
  #jsa-pinned-detail:empty { display:none; }
  #jsa-pinned-detail { margin-bottom:14px; }
  .remote-box {
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; margin:14px 0 4px;
  }
  .remote-box .rb-field { display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--dim); }
  .remote-box select, .remote-box input[type=number] {
    background:var(--card-2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:6px 8px; font-size:13px; outline:none;
  }
  .remote-box input[type=number] { width:60px; }
  .remote-box select:focus, .remote-box input:focus { border-color:var(--accent); }
  .remote-box .rb-run {
    background:var(--accent); color:#fff; border:none; border-radius:999px;
    padding:8px 18px; font-size:13px; font-weight:700; cursor:pointer;
  }
  .remote-box .rb-run:hover { filter:brightness(1.1); }
  .remote-box .rb-run:disabled { background:var(--border); color:var(--faint); cursor:not-allowed; }
  .remote-box .rb-gear {
    background:none; border:1px solid var(--border); color:var(--dim); border-radius:8px;
    padding:6px 9px; cursor:pointer; font-size:13px;
  }
  .remote-box .rb-gear:hover { border-color:var(--accent); color:var(--accent); }
  .remote-status { font-size:12px; color:var(--dim); margin:6px 2px 0; min-height:16px; }
  .remote-status.ok { color:var(--win); }
  .remote-status.err { color:var(--lose); }
  .running-banner {
    display:none; align-items:flex-start; gap:8px; background:var(--accent-dim); color:var(--accent);
    border:1px solid rgba(79,140,255,.35); border-radius:10px; padding:8px 12px; font-size:12.5px;
    font-weight:600; margin:6px 0 2px;
  }
  .running-banner.show { display:flex; }
  .running-banner .dot {
    width:7px; height:7px; border-radius:50%; background:var(--accent); flex-shrink:0;
    margin-top:5px;
    animation: jsa-pulse 1.2s ease-in-out infinite;
  }
  @keyframes jsa-pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
  .running-banner .rb-body { flex:1; min-width:0; display:flex; flex-direction:column; gap:5px; }
  .running-banner .rb-progress-track {
    display:none; background:rgba(79,140,255,.18); border-radius:999px; height:5px; overflow:hidden;
  }
  .running-banner .rb-progress-track.show { display:block; }
  .running-banner .rb-progress-fill {
    background:var(--accent); height:100%; width:0%; border-radius:999px; transition:width .4s ease;
  }
  #jsa-lock {
    position:fixed; inset:0; background:var(--bg); z-index:9999;
    display:flex; align-items:center; justify-content:center;
  }
  #jsa-lock .box {
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:28px 26px; width:280px; text-align:center;
  }
  #jsa-lock .box h2 { font-size:15px; margin:0 0 14px; }
  #jsa-lock input {
    width:100%; background:var(--card-2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:10px 12px; font-size:16px; text-align:center; letter-spacing:4px;
    outline:none;
  }
  #jsa-lock input:focus { border-color:var(--accent); }
  #jsa-lock .err { color:var(--lose); font-size:12px; margin-top:8px; min-height:15px; }

</style>
</head>
<body>
  <div id="jsa-lock">
    <div class="box">
      <h2>🔒 비밀번호를 입력하세요</h2>
      <input id="jsa-pw" type="password" inputmode="numeric" autocomplete="off" autofocus>
      <div class="err" id="jsa-pw-err"></div>
    </div>
  </div>
  <script>
  (function () {
    // 비밀번호는 코드에 평문으로 적지 않고 SHA-256 해시만 저장한다.
    // 소스를 열어봐도 이 해시값으로는 원래 비밀번호를 알아낼 수 없음.
    var PW_HASH = '9af15b336e6a9619928537df30b2e6a2376569fcf9d7e773eccede65606529a0';
    var PW_LEN = 4;
    function sha256Hex(str) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function (buf) {
        return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
      });
    }
    function unlock() {
      document.getElementById('jsa-lock').remove();
      document.getElementById('jsa-wrap').style.display = '';
      try { sessionStorage.setItem('jsa-unlocked', '1'); } catch (e) {}
    }
    function initLock() {
      try {
        if (sessionStorage.getItem('jsa-unlocked') === '1') { unlock(); return; }
      } catch (e) {}
      var input = document.getElementById('jsa-pw');
      var err = document.getElementById('jsa-pw-err');
      var checking = false;
      input.addEventListener('input', function () {
        if (checking || input.value.length < PW_LEN) { err.textContent = ''; return; }
        checking = true;
        var tried = input.value;
        sha256Hex(tried).then(function (hex) {
          checking = false;
          if (hex === PW_HASH) { unlock(); return; }
          err.textContent = '비밀번호가 올바르지 않습니다.';
          input.value = '';
        }).catch(function () { checking = false; });
      });
      input.focus();
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initLock);
    else initLock();
  })();
  </script>
  <div class="wrap" id="jsa-wrap" style="display:none;">
    <header>
      <h1>📊 정산 승률 대시보드</h1>
      <a class="install-link" href="https://raw.githubusercontent.com/srleeinkorea/rota-status2/main/fmkorea_jungsan_analyzer.user.js">유저스크립트 설치</a>
    </header>
    <div class="meta" id="meta">불러오는 중...</div>
    <div class="remote-box">
      <div class="rb-field">기간
        <select id="rb-window">
          <option value="today">오늘</option>
          <option value="24h" selected>최근 24시간</option>
          <option value="2d">최근 2일</option>
          <option value="3d">최근 3일</option>
          <option value="5d">최근 5일</option>
          <option value="7d">최근 7일</option>
          <option value="15d">최근 15일</option>
          <option value="30d">최근 30일</option>
        </select>
      </div>
      <div class="rb-field">최소 베팅건수
        <input id="rb-minpicks" type="number" value="5" min="1">
      </div>
      <button class="rb-run" id="rb-run">분석 시작</button>
      <button class="rb-gear" id="rb-gear" title="GitHub 토큰 설정">⚙</button>
    </div>
    <div class="running-banner" id="rb-running-banner">
      <span class="dot"></span>
      <div class="rb-body">
        <span id="rb-running-text"></span>
        <div class="rb-progress-track" id="rb-progress-track"><div class="rb-progress-fill" id="rb-progress-fill"></div></div>
      </div>
    </div>
    <div class="remote-status" id="rb-status"></div>
    <div class="search-box">
      <input id="jsa-search" type="text" placeholder="🔍 닉네임으로 찾기 (예: 손나은)" autocomplete="off">
      <div class="hint" id="jsa-search-hint"></div>
    </div>
    <div id="jsa-pinned"></div>
    <div id="jsa-pinned-detail"></div>
    <div id="jsa-search-results"></div>
    <div id="content"></div>
  </div>

<script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function fmtPct(n) { return Math.round(n) + '%'; }
function numFmt(n) { return Math.round(n).toLocaleString('ko-KR'); }
function fmtDate(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  } catch (e) { return iso; }
}

function picksHtml(picks) {
  if (!picks || picks.length === 0) return '<span class="muted">—</span>';
  const shown = picks.slice(0, 6);
  let html = '<div class="picks">';
  html += shown.map((p) => {
    const label = escapeHtml(p.team) + (p.bet ? `(${numFmt(p.bet)})` : '');
    if (p.url) return `<a class="pick-chip" href="${escapeHtml(p.url)}" target="_blank" rel="noopener noreferrer">${label}</a>`;
    return `<span class="pick-chip">${label}</span>`;
  }).join('');
  if (picks.length > 6) html += `<span class="muted">+${picks.length - 6}</span>`;
  html += '</div>';
  return html;
}

function rowHtml(r, withMoney, rankIdx) {
  const medal = ['r1','r2','r3'][rankIdx] || '';
  const rateClass = r.rate >= 70 ? 'high' : 'low';
  let html = `<tr data-jsa-name="${escapeHtml(r.name.toLowerCase())}"><td><span class="rank ${medal}">${rankIdx + 1}</span></td><td class="name">${escapeHtml(r.name)}</td><td><span class="pill">${r.win}승${r.lose}패</span></td><td class="rate ${rateClass}">${fmtPct(r.rate)}</td>`;
  if (withMoney) {
    const profitClass = r.profit >= 0 ? 'pos' : 'neg';
    html += `<td class="money">${numFmt(r.totalBet)}</td><td class="profit ${profitClass}">${r.profit >= 0 ? '+' : ''}${numFmt(r.profit)}</td><td>${picksHtml(r.picks)}</td>`;
  }
  html += '</tr>';
  return html;
}

function oddsFor(sum, side) {
  if (!sum || !side) return '-';
  return (sum / side).toFixed(2);
}

function matchCardHtml(m) {
  const totalA = m.betA || 0, totalB = m.betB || 0;
  const sum = totalA + totalB;
  const pctA = sum > 0 ? Math.round((totalA / sum) * 100) : 50;
  const pctB = 100 - pctA;
  const oddsA = oddsFor(sum, totalA);
  const oddsB = oddsFor(sum, totalB);
  return `<a class="match-card" href="${escapeHtml(m.url)}" target="_blank" rel="noopener noreferrer">
    <div class="match-title">${escapeHtml(m.title)}</div>
    <div class="match-sides">
      <div class="match-side">
        <div class="team">${escapeHtml(m.teamA)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pctA}%;"></div></div>
        <div class="stat"><span class="odds">${oddsA}배</span> · ${m.countA || 0}명 · ${numFmt(totalA)}P (${pctA}%)</div>
      </div>
      <div class="match-vs">VS</div>
      <div class="match-side">
        <div class="team">${escapeHtml(m.teamB)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pctB}%;"></div></div>
        <div class="stat"><span class="odds">${oddsB}배</span> · ${m.countB || 0}명 · ${numFmt(totalB)}P (${pctB}%)</div>
      </div>
    </div>
  </a>`;
}

let dashboardData = null;

// "진행중인 경기" 섹션 접기/펼치기 상태 (기본값: 펼침)
const ONGOING_OPEN_KEY = 'jsa-dash-ongoing-open';
function isOngoingOpen() {
  try { return localStorage.getItem(ONGOING_OPEN_KEY) !== '0'; } catch (e) { return true; }
}
function setOngoingOpen(open) {
  try { localStorage.setItem(ONGOING_OPEN_KEY, open ? '1' : '0'); } catch (e) { /* 무시 */ }
}

function render(data) {
  dashboardData = data;
  const metaEl = document.getElementById('meta');
  const contentEl = document.getElementById('content');
  const ongoingPart = data.ongoingUpdatedAt ? ` · 진행중 경기 ${fmtDate(data.ongoingUpdatedAt)} 갱신` : '';
  metaEl.textContent = `${fmtDate(data.generatedAt)} 기준 · ${data.windowLabel || ''} · 최소 ${data.minPicks}건 · 참여자 ${data.totalParticipants}명${ongoingPart}`;

  let html = '';
  const matches = data.ongoingMatches || [];
  if (matches.length) {
    // 접기/펼치기 상태는 localStorage에 기억해서, 새로고침하거나 결과가 갱신돼도 유지된다.
    const openAttr = isOngoingOpen() ? ' open' : '';
    html += `<details class="ongoing" id="jsa-ongoing"${openAttr}>`;
    html += `<summary>🔴 진행중인 경기 <span class="count-badge">${matches.length}건</span></summary>`;
    html += '<div class="ongoing-body">';
    matches.forEach((m) => { html += matchCardHtml(m); });
    html += '</div></details>';
  }

  html += `<div class="section-title">🏆 종합 승률 랭킹 <span class="count-badge">${data.overall.length}명</span></div>`;
  if (!data.overall || data.overall.length === 0) {
    html += `<div class="muted">데이터가 없습니다.</div>`;
  } else {
    html += '<div class="card"><table><thead><tr><th></th><th>닉네임</th><th>전적</th><th>승률</th><th style="text-align:right;">베팅액</th><th style="text-align:right;">수익</th><th>진행중인 베팅</th></tr></thead><tbody>';
    data.overall.forEach((r, idx) => { html += rowHtml(r, true, idx); });
    html += '</tbody></table></div>';
  }

  const sportNames = Object.keys(data.sports || {});
  if (sportNames.length) {
    html += `<details class="sport"><summary>⚽ 종목별 랭킹 <span class="count-badge">${sportNames.length}개 종목</span></summary><div class="sport-card">`;
    for (const sport of sportNames) {
      const arr = data.sports[sport];
      html += `<div class="sport-header">${escapeHtml(sport)} <span class="count-badge">${arr.length}명</span></div>`;
      html += '<div class="card"><table><thead><tr><th></th><th>닉네임</th><th>전적</th><th>승률</th></tr></thead><tbody>';
      arr.forEach((r, idx) => { html += rowHtml(r, false, idx); });
      html += '</tbody></table></div>';
    }
    html += '</div></details>';
  }

  contentEl.innerHTML = html;
  // 사용자가 직접 접거나 펼친 상태를 기억해둔다 (결과가 갱신돼 다시 그려져도 유지되도록)
  const ongoingEl = document.getElementById('jsa-ongoing');
  if (ongoingEl) ongoingEl.addEventListener('toggle', () => setOngoingOpen(ongoingEl.open));
  renderPinnedCards();
  applySearchFilter();
}

// 닉네임 검색 (닉네임 찾기):
// 1) 업로드된 전체 베팅 내역(allPicks)·전체 전적(allRecords)에서 일치하는
//    사람을 찾아 "이 사람이 어느 경기 어느 팀에 얼마 걸었는지" 카드로 보여주고
// 2) 랭킹 테이블도 일치하는 행만 남긴다.
// 전부 마지막 분석 업로드 시점 기준 데이터다(실시간 아님).
function finderCardHtml(name, record, picks, pinned) {
  let html = `<div class="finder-card${pinned ? ' pinned' : ''}"><div class="finder-name">${escapeHtml(name)}</div>`;
  if (record) {
    const profitClass = record.profit >= 0 ? 'pos' : 'neg';
    html += `<div class="finder-record">전적 <span class="pill">${record.win}승${record.lose}패</span> · 승률 <span class="rate-chip">${fmtPct(record.rate)}</span> · 베팅액 ${numFmt(record.totalBet)} · 수익 <span class="profit ${profitClass}" style="font-weight:700;">${record.profit >= 0 ? '+' : ''}${numFmt(record.profit)}</span></div>`;
  }
  if (picks && picks.length) {
    html += `<div class="finder-picks-label">진행중인 베팅 ${picks.length}건</div>`;
    html += picksHtml(picks.length > 6 ? picks : picks); // picksHtml이 6건 넘으면 +N 처리
  } else {
    html += `<div class="no-picks">진행중인 베팅 없음</div>`;
  }
  html += '</div>';
  return html;
}

// 항상 고정으로 보여줄 닉네임 목록 (검색창에 아무것도 입력하지 않아도 표시됨)
const PINNED_NAMES = ['손나은', 'IU와함께', '고양이365만원', '홍유순', '에버딘', 'SI모', '고결', 'Lillie', 'Erebor', 'KU.1905.', '0대0무승부0점', '초코소라빵', '김대승', '로즈'];

let pinnedRecordByName = new Map();
let pinnedPicksByName = new Map();
let pinnedOpenName = null;

function pinnedChipHtml(name, record, picks) {
  const rateClass = record && record.rate >= 70 ? '' : 'low';
  const recordPart = record
    ? `<span class="pin-sep">·</span><span class="pin-rate ${rateClass}">${fmtPct(record.rate)}</span><span class="pin-sep">(${record.win}승${record.lose}패)</span>`
    : `<span class="pin-sep">· 기록없음</span>`;
  const livePart = picks && picks.length ? `<span class="pin-sep">·</span><span class="pin-live">진행중 ${picks.length}</span>` : '';
  const activeClass = pinnedOpenName === name ? ' active' : '';
  return `<span class="pinned-chip${activeClass}" data-pin-name="${escapeHtml(name)}"><span class="pin-name">📌 ${escapeHtml(name)}</span>${recordPart}${livePart}</span>`;
}

function renderPinnedDetail() {
  const detailEl = document.getElementById('jsa-pinned-detail');
  if (!detailEl) return;
  if (!pinnedOpenName) { detailEl.innerHTML = ''; return; }
  const record = pinnedRecordByName.get(pinnedOpenName) || null;
  const picks = pinnedPicksByName.get(pinnedOpenName) || [];
  detailEl.innerHTML = finderCardHtml(pinnedOpenName, record, picks, true);
}

function renderPinnedCards() {
  const el = document.getElementById('jsa-pinned');
  if (!el) return;
  if (!dashboardData) { el.innerHTML = ''; pinnedRecordByName = new Map(); pinnedPicksByName = new Map(); renderPinnedDetail(); return; }
  pinnedRecordByName = new Map();
  (dashboardData.allRecords || []).forEach((r) => { pinnedRecordByName.set(r.name, r); });
  pinnedPicksByName = new Map();
  (dashboardData.allPicks || []).forEach((p) => { pinnedPicksByName.set(p.name, p.picks || []); });

  let html = `<div class="pinned-title">📌 고정 닉네임 (클릭하면 상세보기)</div><div class="pinned-grid">`;
  PINNED_NAMES.forEach((name) => {
    html += pinnedChipHtml(name, pinnedRecordByName.get(name) || null, pinnedPicksByName.get(name) || []);
  });
  html += '</div>';
  el.innerHTML = html;
  renderPinnedDetail();
}

document.getElementById('jsa-pinned').addEventListener('click', (e) => {
  const chip = e.target.closest('.pinned-chip');
  if (!chip) return;
  const name = chip.getAttribute('data-pin-name');
  pinnedOpenName = pinnedOpenName === name ? null : name;
  renderPinnedCards();
});

function applySearchFilter() {
  const input = document.getElementById('jsa-search');
  const hint = document.getElementById('jsa-search-hint');
  const resultsEl = document.getElementById('jsa-search-results');
  if (!input) return;
  const q = input.value.trim().toLowerCase();
  const rows = document.querySelectorAll('#content tr[data-jsa-name]');
  if (!q) {
    rows.forEach((tr) => { tr.classList.remove('jsa-hide', 'jsa-match'); });
    document.querySelectorAll('#content details.sport').forEach((d) => { d.open = false; });
    hint.textContent = '';
    if (resultsEl) resultsEl.innerHTML = '';
    return;
  }

  // 1) 전체 데이터(allPicks + allRecords)에서 닉네임 찾기
  let finderHtml = '';
  let finderCount = 0;
  if (dashboardData) {
    const recordByName = new Map();
    (dashboardData.allRecords || []).forEach((r) => { recordByName.set(r.name, r); });
    const picksByName = new Map();
    (dashboardData.allPicks || []).forEach((p) => { picksByName.set(p.name, p.picks || []); });

    const matchedNames = new Set();
    for (const name of picksByName.keys()) {
      if (name.toLowerCase().includes(q)) matchedNames.add(name);
    }
    for (const name of recordByName.keys()) {
      if (name.toLowerCase().includes(q)) matchedNames.add(name);
    }
    const sorted = Array.from(matchedNames).sort((a, b) => a.localeCompare(b, 'ko'));
    const MAX_CARDS = 20;
    sorted.slice(0, MAX_CARDS).forEach((name) => {
      finderHtml += finderCardHtml(name, recordByName.get(name) || null, picksByName.get(name) || []);
    });
    if (sorted.length > MAX_CARDS) {
      finderHtml += `<div class="muted" style="margin-bottom:10px;">+${sorted.length - MAX_CARDS}명 더 있음 — 더 정확히 입력해보세요.</div>`;
    }
    finderCount = sorted.length;
  }
  if (resultsEl) resultsEl.innerHTML = finderHtml;

  // 2) 랭킹 테이블 필터링
  let matchCount = 0;
  const sportsWithMatch = new Set();
  rows.forEach((tr) => {
    const name = tr.getAttribute('data-jsa-name') || '';
    if (name.includes(q)) {
      tr.classList.remove('jsa-hide');
      tr.classList.add('jsa-match');
      matchCount++;
      const sportDetails = tr.closest('details.sport');
      if (sportDetails) sportsWithMatch.add(sportDetails);
    } else {
      tr.classList.add('jsa-hide');
      tr.classList.remove('jsa-match');
    }
  });
  sportsWithMatch.forEach((d) => { d.open = true; });

  const hasFullData = dashboardData && (dashboardData.allPicks || dashboardData.allRecords);
  if (finderCount > 0 || matchCount > 0) {
    hint.textContent = `${Math.max(finderCount, matchCount)}명 일치 · 마지막 분석 업로드 시점 기준`;
  } else if (!hasFullData) {
    hint.textContent = '일치 없음 — 전체 검색 데이터는 스크립트 v3.7 이상으로 분석을 한 번 돌리면 올라옵니다.';
  } else {
    hint.textContent = '일치하는 닉네임이 없습니다.';
  }
}

function renderEmpty() {
  document.getElementById('meta').textContent = '';
  const searchBox = document.querySelector('.search-box');
  if (searchBox) searchBox.style.display = 'none';
  const pinnedEl = document.getElementById('jsa-pinned');
  if (pinnedEl) pinnedEl.innerHTML = '';
  document.getElementById('content').innerHTML = `
    <div class="empty-state">
      <div>아직 업로드된 분석 결과가 없습니다.</div>
      <div class="muted" style="margin-top:6px;">유저스크립트를 설치하고 해당 사이트에서 분석을 한 번 돌리면, 완료 시 자동으로 이 페이지에 반영됩니다.</div>
      <a class="btn" href="https://raw.githubusercontent.com/srleeinkorea/rota-status2/main/fmkorea_jungsan_analyzer.user.js">유저스크립트 설치하기</a>
    </div>`;
}

document.getElementById('jsa-search').addEventListener('input', applySearchFilter);

// ---------- 원격 분석 요청 ----------
// "분석 시작"을 누르면 저장소의 command.json에 요청을 기록한다.
// fmkorea 탭에 떠 있는 유저스크립트(v3.7+)가 45초마다 이 파일을 확인해서
// 새 요청이 있으면 그 기간/건수로 분석을 대신 실행하고, 끝나면 결과를
// data.json으로 올린다. 아래 자동 갱신 폴링이 그 새 결과를 감지해 화면을
// 바꿔준다. (fmkorea 탭이 하나 이상 열려 있어야 작동)
const GH_REPO = 'srleeinkorea/rota-status2';
const DASH_TOKEN_KEY = 'jsa-dash-gh-token';

function getDashToken() {
  try { return localStorage.getItem(DASH_TOKEN_KEY) || ''; } catch (e) { return ''; }
}
function setDashToken(t) {
  try {
    if (t) localStorage.setItem(DASH_TOKEN_KEY, t);
    else localStorage.removeItem(DASH_TOKEN_KEY);
  } catch (e) {}
}
function promptDashToken() {
  const cur = getDashToken();
  const masked = cur ? `설정됨 (끝자리 ...${cur.slice(-4)})` : '설정 안 됨';
  const input = window.prompt(
    `원격으로 분석을 시작하려면 repo 쓰기 권한이 있는 GitHub 토큰이 필요합니다.\n` +
    `(유저스크립트 ⚙에 넣은 것과 같은 토큰을 쓰면 됩니다)\n현재 상태: ${masked}\n` +
    `비워두고 확인 = 삭제, 취소 = 변경 없음`, '');
  if (input === null) return getDashToken();
  setDashToken(input.trim());
  return input.trim();
}

function rbStatus(msg, cls) {
  const el = document.getElementById('rb-status');
  el.textContent = msg || '';
  el.className = 'remote-status' + (cls ? ' ' + cls : '');
}

// ---------- 마지막 선택값 기억 (기간/최소 베팅건수) ----------
// 예전엔 새로고침/재방문 때마다 항상 기본값(24시간/5건)으로 돌아가서,
// 매번 다시 골라야 했다. 이제 고를 때마다 localStorage에 저장해두고
// 페이지를 열 때 복원한다.
const RB_WINDOW_KEY = 'jsa-dash-window';
const RB_MINPICKS_KEY = 'jsa-dash-minpicks';

function restoreRbSelection() {
  try {
    const savedWindow = localStorage.getItem(RB_WINDOW_KEY);
    const windowSel = document.getElementById('rb-window');
    if (savedWindow && windowSel.querySelector(`option[value="${savedWindow}"]`)) {
      windowSel.value = savedWindow;
    }
    const savedMin = localStorage.getItem(RB_MINPICKS_KEY);
    if (savedMin) document.getElementById('rb-minpicks').value = savedMin;
  } catch (e) { /* 무시 */ }
}
function saveRbSelection() {
  try {
    localStorage.setItem(RB_WINDOW_KEY, document.getElementById('rb-window').value);
    localStorage.setItem(RB_MINPICKS_KEY, document.getElementById('rb-minpicks').value);
  } catch (e) { /* 무시 */ }
}
restoreRbSelection();
document.getElementById('rb-window').addEventListener('change', saveRbSelection);
document.getElementById('rb-minpicks').addEventListener('change', saveRbSelection);
document.getElementById('rb-minpicks').addEventListener('input', saveRbSelection);

async function sendRunCommand() {
  let token = getDashToken();
  if (!token) token = promptDashToken();
  if (!token) { rbStatus('토큰이 설정되지 않아 요청을 보낼 수 없습니다.', 'err'); return; }

  const btn = document.getElementById('rb-run');
  btn.disabled = true;
  rbStatus('요청 전송 중...');
  try {
    const cmd = {
      action: 'run',
      windowValue: document.getElementById('rb-window').value,
      minPicks: parseInt(document.getElementById('rb-minpicks').value, 10) || 5,
      requestedAt: new Date().toISOString(),
    };
    const apiUrl = `https://api.github.com/repos/${GH_REPO}/contents/command.json`;
    const headers = {
      Authorization: `Bearer ${token}`,
      Accept: 'application/vnd.github+json',
      'Content-Type': 'application/json',
    };
    let sha;
    const getRes = await fetch(`${apiUrl}?t=${Date.now()}`, { headers });
    if (getRes.ok) { const info = await getRes.json(); sha = info.sha; }
    const body = {
      message: `원격 분석 요청 (${cmd.requestedAt})`,
      content: btoa(unescape(encodeURIComponent(JSON.stringify(cmd)))),
    };
    if (sha) body.sha = sha;
    const putRes = await fetch(apiUrl, { method: 'PUT', headers, body: JSON.stringify(body) });
    if (!putRes.ok) {
      const t = await putRes.text().catch(() => '');
      rbStatus(`요청 실패 (${putRes.status}): 토큰 권한을 확인해주세요. ${t.slice(0, 80)}`, 'err');
    } else {
      lastSentCommandAt = Date.now();
      rbStatus('✅ 요청 전송 완료 — fmkorea 탭이 열려 있으면 1분 안에 분석이 시작되고, 끝나면 이 페이지가 자동으로 갱신됩니다.', 'ok');
    }
  } catch (e) {
    rbStatus('요청 전송 중 오류: ' + e.message, 'err');
  }
  btn.disabled = false;
}

document.getElementById('rb-run').addEventListener('click', sendRunCommand);
document.getElementById('rb-gear').addEventListener('click', () => {
  const t = promptDashToken();
  rbStatus(t ? '토큰이 저장되었습니다.' : '토큰이 삭제되었습니다.');
});

// ---------- 새 결과 자동 갱신 ----------
// 30초마다 data.json의 generatedAt을 확인해서 바뀌면 화면을 새 데이터로 교체.
let lastGeneratedAt = null;
let lastSentCommandAt = 0;

function loadData(first) {
  return fetch('./data.json', { cache: 'no-store' })
    .then((res) => { if (!res.ok) throw new Error('no data'); return res.json(); })
    .then((data) => {
      if (data.generatedAt !== lastGeneratedAt) {
        const isUpdate = lastGeneratedAt !== null;
        lastGeneratedAt = data.generatedAt;
        render(data);
        if (isUpdate && lastSentCommandAt) {
          rbStatus('✅ 새 분석 결과가 반영되었습니다.', 'ok');
          lastSentCommandAt = 0;
        }
      }
    })
    .catch(() => { if (first) renderEmpty(); });
}

// ---------- 분석 진행 상태 표시 ----------
// 유저스크립트가 분석을 시작/종료할 때마다 status.json에 상태를 올린다(토큰이 있을 때만).
// 이 페이지는 누가 요청했는지와 상관없이(자신이 요청 안 했어도, 새로고침해서 들어와도)
// 15초마다 그 파일을 확인해서 지금 분석이 진행 중이면 상단에 배너로 알려준다.
const WINDOW_LABELS = {
  today: '오늘', '24h': '최근 24시간', '2d': '최근 2일', '3d': '최근 3일',
  '5d': '최근 5일', '7d': '최근 7일', '15d': '최근 15일', '30d': '최근 30일',
};

function setBanner(text, pct) {
  const banner = document.getElementById('rb-running-banner');
  const textEl = document.getElementById('rb-running-text');
  const track = document.getElementById('rb-progress-track');
  const fill = document.getElementById('rb-progress-fill');
  if (!text) { banner.classList.remove('show'); track.classList.remove('show'); return; }
  textEl.textContent = text;
  banner.classList.add('show');
  if (typeof pct === 'number' && isFinite(pct)) {
    track.classList.add('show');
    fill.style.width = Math.max(0, Math.min(100, pct)) + '%';
  } else {
    track.classList.remove('show');
  }
}

// status.json(유저스크립트가 실제로 분석을 시작/종료할 때 올림)과 command.json(이 페이지
// 자신이든 다른 사람이든, 누군가 "분석 시작"을 눌러 요청을 남겼을 때)을 함께 보고
// 지금 상황에 맞는 배너를 띄운다.
//  1) status.json이 running이면 → "분석 진행중" (가장 확실한 신호)
//  2) 아직 running은 아니지만, command.json의 요청 시각이 마지막으로 완료된 분석
//     (data.json의 generatedAt)보다 새로우면 → 유저스크립트가 아직 그 요청을 못 집어간
//     상태라고 보고 "요청 대기중"으로 표시 (요청 직후 새로고침해도 사라지지 않게)
const CMD_MAX_AGE_MS = 10 * 60 * 1000; // 10분 넘은 요청은 이미 유실/무시된 것으로 보고 표시 안 함

// 직전에 본 상태가 "진행중"이었다가 이번엔 아니면, 방금 막 끝난 것 — data.json이 30초
// 폴링 주기를 다 기다리지 않고 바로 한 번 더 확인하도록(체감 지연 최소화).
let wasRunning = false;

function refreshBanner() {
  Promise.all([
    fetch('./status.json', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
    fetch('./command.json', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
  ]).then(([status, cmd]) => {
    const isRunning = !!(status && status.state === 'running');
    if (wasRunning && !isRunning) loadData(false); // 진행중 → 완료로 바뀐 순간 바로 결과 가져오기
    wasRunning = isRunning;

    if (isRunning) {
      const label = WINDOW_LABELS[status.windowValue] || status.windowValue || '';
      let startedText = '';
      try {
        if (status.startedAt) {
          const mins = Math.max(0, Math.round((Date.now() - new Date(status.startedAt).getTime()) / 60000));
          startedText = mins <= 0 ? ' (방금 시작)' : ` (${mins}분째 진행 중)`;
        }
      } catch (e) { /* 무시 */ }
      const hasPct = typeof status.pct === 'number';
      const pctText = hasPct ? ` · ${status.pct}% (${status.processed}/${status.total}건)` : '';
      setBanner(
        `🔄 분석 진행 중 — ${label}${status.minPicks ? ' · 최소 ' + status.minPicks + '건' : ''}${startedText}${pctText}`,
        hasPct ? status.pct : undefined
      );
      return;
    }
    if (cmd && cmd.action === 'run' && cmd.requestedAt) {
      const reqTs = new Date(cmd.requestedAt).getTime();
      const genTs = lastGeneratedAt ? new Date(lastGeneratedAt).getTime() : 0;
      const age = Date.now() - reqTs;
      if (reqTs > genTs && age >= 0 && age < CMD_MAX_AGE_MS) {
        const label = WINDOW_LABELS[cmd.windowValue] || cmd.windowValue || '';
        setBanner(`⏳ 분석 요청 대기 중 — ${label}${cmd.minPicks ? ' · 최소 ' + cmd.minPicks + '건' : ''} (fmkorea 탭이 열려 있으면 곧 시작됩니다)`);
        return;
      }
    }
    setBanner(null);
  });
}

loadData(true).then(refreshBanner).catch(refreshBanner);
setInterval(() => loadData(false), 15 * 1000);
setInterval(refreshBanner, 8 * 1000);

// 탭을 백그라운드에 두면 브라우저가 setInterval을 많이 늦춰버려서(수 분까지도), 분석이
// 끝나도 탭으로 돌아올 때까지 화면이 안 바뀐 것처럼 보이는 문제가 있었다. 탭이 다시
// 보이거나 포커스를 받는 순간 바로 한 번 더 확인해서 그 지연을 없앤다.
function refreshNow() { loadData(false); refreshBanner(); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshNow(); });
window.addEventListener('focus', refreshNow);
</script>
</body>
